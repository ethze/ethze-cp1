<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETHZE</title>
    <style>
        @font-face {
            font-family: 'NouvelleGrotesquerie';
            src: url('/fonts/NouvelleGrotesquerie-Regular.woff2') format('woff2'),
                 url('/fonts/NouvelleGrotesquerie-Regular.woff') format('woff'),
                 url('/fonts/NouvelleGrotesquerie-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas#canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        canvas#blob-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        #theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(15, 15, 18, 0.65);
            color: #f5f5f7;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        #theme-toggle:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        body.light-theme #theme-toggle {
            background: rgba(255, 255, 255, 0.78);
            color: #111111;
            border-color: rgba(0, 0, 0, 0.16);
        }

        body.light-theme #theme-toggle:hover {
            border-color: rgba(0, 0, 0, 0.38);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="blob-canvas"></canvas>
    <button id="theme-toggle" type="button" aria-label="Toggle theme">DARK</button>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
